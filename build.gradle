plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CodeCoach project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.projectlombok:lombok'
    // WebClient 및 관련 클래스 사용을 위한 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JSON 파싱을 위한 ObjectMapper가 포함된 Jackson 라이브러리
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JSON 파싱을 위한 Jackson 라이브러리 추가 (핵심 해결책)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 롬복(Lombok) 사용을 위한 의존성 (Getter, Builder 등 DTO 생성을 위해 필요)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
