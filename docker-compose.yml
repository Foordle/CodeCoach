version: '3.8'

services:
  # 1. Spring Boot 웹 서버
  codecoach-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codecoach-web
    ports:
      - "8080:8080"
    volumes:
      # [핵심 1] 호스트의 도커 소켓을 컨테이너와 공유 (DooD 방식)
      - /var/run/docker.sock:/var/run/docker.sock
      # [핵심 2] 코드 실행용 임시 폴더 공유
      - ./temp_code_storage:/app/temp_code_storage
      - ./temp_repos:/app/temp_repos
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY} # .env 파일에서 읽어옴
    restart: always

  # 2. (선택사항) 실행용 이미지 미리 빌드해두기
  # 이 부분은 수동으로 'docker build -f Dockerfile.runner ...' 했던 것을 자동화합니다.
  code-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: code-runner-env:latest
    command: ["echo", "Code Runner Image Built"]